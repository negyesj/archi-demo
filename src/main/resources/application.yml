spring:
  application:
    name: outbox-relay
  main:
    web-application-type: none
    keep-alive: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5

platform:
  service-id: outbox-relay
  platform-db:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:platform_app}
  secrets:
    key: ${PLATFORM_SECRET_KEY:}
  tenant-db:
    enabled: true
    host: ${TENANT_DB_HOST:localhost}
    port: ${TENANT_DB_PORT:5432}

relay:
  batch-size: ${RELAY_BATCH_SIZE:200}
  poll-interval-ms: ${RELAY_POLL_MS:500}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
