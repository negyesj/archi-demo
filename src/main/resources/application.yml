spring:
  application:
    name: tenant-admin
  datasource:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:platform_app}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}

platform:
  service-id: tenant-admin
  core-services: [iam, audit, webhook]
  bootstrap-admin:
    username: ${PLATFORM_ADMIN_USERNAME:admin}
    email: ${PLATFORM_ADMIN_EMAIL:admin@example.local}
    full-name: ${PLATFORM_ADMIN_NAME:Platform Admin}
  kafka:
    replicas: ${KAFKA_REPLICAS:1}
  platform-db:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:platform_app}
  secrets:
    key: ${PLATFORM_SECRET_KEY:}
  keycloak:
    url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
    admin-user: ${KEYCLOAK_ADMIN_USER:admin}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  web:
    issuer-base: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
    jwks-base: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    redis:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
