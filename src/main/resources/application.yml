spring:
  application:
    name: webhook
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: false

server:
  port: ${PORT:8080}

platform:
  service-id: webhook
  platform-db:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:platform_app}
  secrets:
    key: ${PLATFORM_SECRET_KEY:}
  tenant-db:
    enabled: true
    host: ${TENANT_DB_HOST:localhost}
    port: ${TENANT_DB_PORT:5432}
    migrations:
      - schema: webhook
        location: classpath:db/tenant/webhook
  web:
    core-service: true
    issuer-base: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
    jwks-base: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
    iam-base-url: ${IAM_BASE_URL:http://localhost:8082}

webhook:
  allow-insecure-http: ${WEBHOOK_ALLOW_HTTP:false}
  max-attempts: ${WEBHOOK_MAX_ATTEMPTS:8}
  suspend-after-failures: ${WEBHOOK_SUSPEND_AFTER:20}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  health:
    db:
      enabled: false
    redis:
      enabled: false
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
