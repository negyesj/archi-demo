spring:
  application:
    name: reporting-projector
  main:
    web-application-type: none
    keep-alive: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

platform:
  service-id: reporting-projector
  platform-db:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:platform_app}
  secrets:
    key: ${PLATFORM_SECRET_KEY:}
  reporting:
    host: ${MONGO_HOST:localhost}
    port: ${MONGO_PORT:27017}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# Műveleti trail: a részletes lépések megőrzése (napokban); az órás összesítő 400 napig marad
trail:
  retention-days: ${TRAIL_RETENTION_DAYS:14}
