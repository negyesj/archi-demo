spring:
  application:
    name: gateway-${GATEWAY_MODE:ui}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}

platform:
  service-id: gateway

gateway:
  mode: ${GATEWAY_MODE:ui}
  issuer-base: ${KEYCLOAK_PUBLIC_URL:http://localhost:8180}
  jwks-base: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
  admin-uri: ${TENANT_ADMIN_URI:http://localhost:8081}
  core-services: [iam, audit, webhook]
  rate-limit:
    replenish-rate: ${RATE_LIMIT_RPS:20}
    burst-capacity: ${RATE_LIMIT_BURST:40}
  services:
    iam: ${IAM_URI:http://localhost:8082}
    audit: ${AUDIT_URI:http://localhost:8083}
    partner: ${PARTNER_URI:http://localhost:8084}
    irat: ${IRAT_URI:http://localhost:8085}
    webhook: ${WEBHOOK_URI:http://localhost:8086}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
