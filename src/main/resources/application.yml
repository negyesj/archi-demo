spring:
  application:
    name: provisioner
  main:
    web-application-type: none
    keep-alive: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

platform:
  service-id: provisioner
  platform-db:
    url: ${PLATFORM_DB_URL:jdbc:postgresql://localhost:5432/platform}
    username: ${PLATFORM_DB_USER:platform_app}
    password: ${PLATFORM_DB_PASSWORD:platform_app}
  secrets:
    key: ${PLATFORM_SECRET_KEY:}

provisioner:
  postgres-admin-url: ${PG_ADMIN_URL:jdbc:postgresql://localhost:5432/postgres}
  postgres-admin-user: ${PG_ADMIN_USER:postgres}
  postgres-admin-password: ${PG_ADMIN_PASSWORD:postgres}
  mongo-admin-uri: ${MONGO_ADMIN_URI:mongodb://root:root@localhost:27017/admin}
  keycloak-url: ${KEYCLOAK_INTERNAL_URL:http://localhost:8180}
  keycloak-admin-user: ${KEYCLOAK_ADMIN_USER:admin}
  keycloak-admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}
  app-redirect-uris: ${APP_REDIRECT_URIS:http://localhost:4200/*,http://localhost:8080/*}
  app-web-origins: ${APP_WEB_ORIGINS:+}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
